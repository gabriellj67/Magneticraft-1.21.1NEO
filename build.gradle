plugins {
    id "net.neoforged.moddev.legacyforge"
    id "maven-publish"
}

version = "${mc_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-${mod_platform}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
    options.compilerArgs.add("-Xlint:deprecation")
}

repositories {
    mavenCentral()
    maven {
        name = "BlameJared Maven"
        url = uri("https://maven.blamejared.com")
        content {
            includeGroup "mezz.jei"
            includeGroup "com.blamejared.crafttweaker"
            includeGroup "org.openzen.zencode"
        }
    }
    maven {
        name = "DVS1 Maven FS"
        url = uri("https://dvs1.progwml6.com/files/maven")
        content {
            includeGroup "slimeknights.mantle"
            includeGroup "slimeknights.tconstruct"
        }
    }
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup "maven.modrinth"
        }
    }
}

def optionalRuntimeEnabled = { String propertyName ->
    providers.gradleProperty(propertyName).map { it.toBoolean() }.getOrElse(false)
}
def jeiRuntimeEnabled = optionalRuntimeEnabled("enable_jei_runtime")
def craftTweakerRuntimeEnabled = optionalRuntimeEnabled("enable_crafttweaker_runtime")
def tconstructRuntimeEnabled = optionalRuntimeEnabled("enable_tconstruct_runtime")
def jadeRuntimeEnabled = optionalRuntimeEnabled("enable_jade_runtime")
def quickPlayWorld = providers.gradleProperty("quick_play_world").orNull
def serverWorld = providers.gradleProperty("server_world").orNull

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // LegacyForge production mod jars must enter the remapping configurations.
    modCompileOnly("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    modCompileOnly("com.blamejared.crafttweaker:CraftTweaker-forge-${mc_version}:${crafttweaker_version}")
    modCompileOnly("maven.modrinth:jade:${jade_version}")

    if (jeiRuntimeEnabled) {
        ["core", "common", "common-api", "lib", "gui", "forge-api", "forge"].each { module ->
            modLocalRuntime("mezz.jei:jei-${mc_version}-${module}:${jei_version}")
        }
    }
    if (craftTweakerRuntimeEnabled) {
        modLocalRuntime("com.blamejared.crafttweaker:CraftTweaker-forge-${mc_version}:${crafttweaker_version}")
        [
                "CodeFormatter",
                "CodeFormatterShared",
                "JavaIntegration",
                "JavaAnnotations",
                "JavaBytecodeCompiler",
                "JavaShared",
                "Validator",
                "Parser",
                "CodeModel",
                "Shared"
        ].each { module ->
            localRuntime("org.openzen.zencode:${module}:${crafttweaker_zencode_version}")
        }
    }
    if (tconstructRuntimeEnabled) {
        modLocalRuntime("slimeknights.mantle:Mantle:${mc_version}-${mantle_version}")
        modLocalRuntime("slimeknights.tconstruct:TConstruct:${mc_version}-${tconstruct_version}")
    }
    if (jadeRuntimeEnabled) {
        modLocalRuntime("maven.modrinth:jade:${jade_version}")
    }

    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

def prepareCraftTweakerIntegrationScripts = tasks.register("prepareCraftTweakerIntegrationScripts", Copy) {
    from("src/integrationTest/crafttweaker/scripts")
    into(layout.projectDirectory.dir("run/scripts"))
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

sourceSets {
    gameTest {
        java.setSrcDirs(["src/gametest/java"])
        resources.setSrcDirs(["src/gametest/resources"])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

legacyForge {
    version = "${mc_version}-${forge_version}"

    parchment {
        minecraftVersion = mc_version
        mappingsVersion = mapping_version
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file("run")
            systemProperty "forge.logging.console.level", "info"
            systemProperty "forge.enabledGameTestNamespaces", mod_id
        }

        client {
            client()
            if (quickPlayWorld) {
                programArguments.addAll("--quickPlaySingleplayer", quickPlayWorld)
            }
        }

        server {
            server()
            programArgument "--nogui"
            if (serverWorld) {
                programArguments.addAll("--world", serverWorld)
            }
            if (craftTweakerRuntimeEnabled) {
                taskBefore prepareCraftTweakerIntegrationScripts
            }
        }

        data {
            data()
            programArguments.addAll(
                    "--mod", mod_id,
                    "--all",
                    "--output", file("src/generated/resources").absolutePath,
                    "--existing", file("src/main/resources").absolutePath
            )
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file("run/gametest")
        }
    }

    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.gameTest)
}

sourceSets {
    main {
        resources {
            srcDir "src/generated/resources"
            exclude ".cache/**"
        }
    }
}

def expansionProperties = [
        project_version     : project.version,
        mc_range            : mc_range,
        forge_version_range : forge_version_range,
        loader_version_range: loader_version_range,
        mod_id              : mod_id,
        mod_name            : mod_name,
        mod_license         : mod_license,
        mod_authors         : mod_authors,
        mod_description     : mod_description,
        issue_tracker       : issue_tracker,
        display_url                : display_url,
        jei_version_range         : jei_version_range,
        crafttweaker_version_range: crafttweaker_version_range,
        tconstruct_version_range  : tconstruct_version_range,
        jade_version_range        : jade_version_range
]

processResources {
    inputs.properties expansionProperties
    filesMatching("META-INF/mods.toml") {
        expand expansionProperties
    }
}

jar {
    from("LICENSE") {
        into "META-INF"
    }
    from("PORTING_SOURCES.md") {
        into "META-INF"
    }
    manifest {
        attributes(
                "Specification-Title": mod_name,
                "Specification-Vendor": mod_authors,
                "Specification-Version": mod_version,
                "Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor": mod_authors
        )
    }
}

tasks.named("sourcesJar", Jar).configure {
    from("LICENSE") {
        into "META-INF"
    }
    from("PORTING_SOURCES.md") {
        into "META-INF"
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = "${mod_id}-${mod_platform}"
        }
    }
    repositories {
        mavenLocal()
    }
}

def verifyOptionalIntegrationIsolation = tasks.register("verifyOptionalIntegrationIsolation") {
    dependsOn tasks.named("jar"), tasks.named("generatePomFileForMavenJavaPublication")
    doLast {
        def productionJar = tasks.named("jar", Jar).get().archiveFile.get().asFile
        def forbiddenPrefixes = [
                "mezz/jei/",
                "com/blamejared/crafttweaker/",
                "org/openzen/",
                "slimeknights/",
                "snownee/jade/"
        ]
        def bundledOptionalClasses = zipTree(productionJar).files.collect { entry ->
            entry.absolutePath.replace('\\', '/')
        }.findAll { entry -> forbiddenPrefixes.any { prefix -> entry.contains("/" + prefix) } }
        if (!bundledOptionalClasses.isEmpty()) {
            throw new GradleException("Production JAR bundled optional API classes: ${bundledOptionalClasses.take(10)}")
        }

        def pom = layout.buildDirectory.file("publications/mavenJava/pom-default.xml").get().asFile.text
        def forbiddenCoordinates = [
                "mezz.jei",
                "com.blamejared.crafttweaker",
                "org.openzen.zencode",
                "slimeknights",
                "maven.modrinth"
        ]
        def publishedOptionalDependencies = forbiddenCoordinates.findAll(pom::contains)
        if (!publishedOptionalDependencies.isEmpty()) {
            throw new GradleException("Publication POM leaked optional dependencies: ${publishedOptionalDependencies}")
        }
    }
}

def verifyReleaseArtifact = tasks.register("verifyReleaseArtifact") {
    dependsOn tasks.named("jar"), tasks.named("sourcesJar")
    doLast {
        def productionJar = tasks.named("jar", Jar).get().archiveFile.get().asFile
        def sourcesJar = tasks.named("sourcesJar", Jar).get().archiveFile.get().asFile
        if (!productionJar.name.contains("-${mod_version}.jar")) {
            throw new GradleException("Production JAR does not carry release version ${mod_version}: ${productionJar.name}")
        }

        def archiveEntries = { File archive ->
            def entries = []
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                def enumeration = zip.entries()
                while (enumeration.hasMoreElements()) {
                    entries.add(enumeration.nextElement().name)
                }
            }
            entries
        }
        def binaryEntries = archiveEntries(productionJar)
        def sourceEntries = archiveEntries(sourcesJar)
        def requiredBinaryEntries = [
                "META-INF/LICENSE",
                "META-INF/mods.toml",
                "assets/magneticraft/lang/en_us.json",
                "assets/magneticraft/lang/zh_cn.json",
                "assets/magneticraft/models/block/mcx/battery.mcx",
                "assets/magneticraft/models/block/gltf/electric_engine.gltf",
                "assets/magneticraft/models/block/gltf/electric_engine.bin",
                "assets/magneticraft/models/block/mcx/solar_panel.mcx",
                "assets/magneticraft/models/block/gltf/grinder.gltf",
                "assets/magneticraft/models/block/gltf/grinder.bin",
                "data/magneticraft/magneticraft/voltage_tiers/low_voltage.json",
                "data/magneticraft/magneticraft/voltage_tiers/medium_voltage.json",
                "data/magneticraft/magneticraft/voltage_tiers/high_voltage.json",
                "data/magneticraft/magneticraft/transformer_profiles/lv_to_mv.json",
                "data/magneticraft/magneticraft/transformer_profiles/mv_to_hv.json",
                "data/magneticraft/magneticraft/machine_electrical_profiles/electric_furnace.json",
                "data/magneticraft/magneticraft/machine_electrical_profiles/steam_turbine.json"
        ]
        def missingEntries = requiredBinaryEntries.findAll { !binaryEntries.contains(it) }
        if (!missingEntries.isEmpty()) {
            throw new GradleException("Production JAR is missing release entries: ${missingEntries}")
        }

        def forbiddenPrefixes = [".references/", "run/", "build/"]
        def forbiddenExtensions = [".glb"]
        def forbiddenEntry = { String entry ->
            forbiddenPrefixes.any(entry::startsWith)
                    || forbiddenExtensions.any { entry.toLowerCase(Locale.ROOT).endsWith(it) }
                    || entry.startsWith("com/cout970/modelloader/")
        }
        def leakedBinaryEntries = binaryEntries.findAll(forbiddenEntry)
        def leakedSourceEntries = sourceEntries.findAll(forbiddenEntry)
        if (!leakedBinaryEntries.isEmpty() || !leakedSourceEntries.isEmpty()) {
            throw new GradleException(
                    "Release archives contain forbidden inputs: binary=${leakedBinaryEntries.take(10)}, "
                            + "sources=${leakedSourceEntries.take(10)}"
            )
        }
        if (!sourceEntries.contains("META-INF/LICENSE")
                || !sourceEntries.contains("META-INF/PORTING_SOURCES.md")) {
            throw new GradleException("Sources JAR is missing license or provenance metadata")
        }
    }
}

tasks.named("check").configure {
    dependsOn tasks.named("compileGameTestJava"), verifyOptionalIntegrationIsolation, verifyReleaseArtifact
}
