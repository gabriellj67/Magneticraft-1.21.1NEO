plugins {
    id "net.neoforged.moddev.legacyforge"
    id "maven-publish"
}

version = "${mc_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-${mod_platform}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
    options.compilerArgs.add("-Xlint:deprecation")
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

sourceSets {
    gameTest {
        java.setSrcDirs(["src/gametest/java"])
        resources.setSrcDirs(["src/gametest/resources"])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

legacyForge {
    version = "${mc_version}-${forge_version}"

    parchment {
        minecraftVersion = mc_version
        mappingsVersion = mapping_version
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file("run")
            systemProperty "forge.logging.console.level", "info"
            systemProperty "forge.enabledGameTestNamespaces", mod_id
        }

        client {
            client()
        }

        server {
            server()
            programArgument "--nogui"
        }

        data {
            data()
            programArguments.addAll(
                    "--mod", mod_id,
                    "--all",
                    "--output", file("src/generated/resources").absolutePath,
                    "--existing", file("src/main/resources").absolutePath
            )
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file("run/gametest")
        }
    }

    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.gameTest)
}

sourceSets {
    main {
        resources {
            srcDir "src/generated/resources"
            exclude ".cache/**"
        }
    }
}

def expansionProperties = [
        project_version     : project.version,
        mc_range            : mc_range,
        forge_version_range : forge_version_range,
        loader_version_range: loader_version_range,
        mod_id              : mod_id,
        mod_name            : mod_name,
        mod_license         : mod_license,
        mod_authors         : mod_authors,
        mod_description     : mod_description,
        issue_tracker       : issue_tracker,
        display_url         : display_url
]

processResources {
    inputs.properties expansionProperties
    filesMatching("META-INF/mods.toml") {
        expand expansionProperties
    }
}

jar {
    from("LICENSE") {
        into "META-INF"
    }
    from("PORTING_SOURCES.md") {
        into "META-INF"
    }
    manifest {
        attributes(
                "Specification-Title": mod_name,
                "Specification-Vendor": mod_authors,
                "Specification-Version": mod_version,
                "Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor": mod_authors
        )
    }
}

tasks.named("sourcesJar", Jar).configure {
    from("LICENSE") {
        into "META-INF"
    }
    from("PORTING_SOURCES.md") {
        into "META-INF"
    }
}

tasks.named("check").configure {
    dependsOn tasks.named("compileGameTestJava")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = "${mod_id}-${mod_platform}"
        }
    }
    repositories {
        mavenLocal()
    }
}
